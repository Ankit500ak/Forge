services:
  - type: web
    name: fitness-app-backend
    env: node
    plan: free
    buildCommand: npm install && python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt && python3 -c "import numpy; import PIL; print('python deps ok')"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_PATH
        value: python3
